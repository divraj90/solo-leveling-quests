        }

        function showRankUpBanner(rankName, isShadowMonarch) {
            const overlay = document.createElement('div');
            overlay.className = 'rank-up-banner';
            overlay.id = 'rank-up-banner';
            overlay.innerHTML = `
                <div class="rank-up-title">RANK UP!</div>
                <div class="rank-up-subtitle ${isShadowMonarch ? 'rank-up-shadow-monarch' : ''}">You are now ${rankName}</div>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                if (overlay.parentNode) {
                    overlay.remove();
                }
            }, 4000);
        }

        // ==================== HEAL ====================
        function useXpToHeal() {
            if (gameState.player.xp < HEAL_COST_XP) {
                addSystemLog(`Not enough XP. Need ${HEAL_COST_XP} XP to heal.`);
                return;
            }

            if (gameState.player.hp >= gameState.player.maxHp) {
                addSystemLog(`HP is already full.`);
                return;
            }

            const xpSpent = HEAL_COST_XP;
            const hpHealed = Math.min(HEAL_AMOUNT, gameState.player.maxHp - gameState.player.hp);

            gameState.player.xp -= xpSpent;
            gameState.player.hp += hpHealed;

            addSystemLog(`Used ${xpSpent} XP to heal ${hpHealed} HP.`, 'success');
            addEventLog('hp_gain', `Healed for ${hpHealed} HP`, { hp: hpHealed, xp: -xpSpent });
            saveGameState();
            renderStatsBar();
        }

        // ==================== TIMER ====================
        let timerInterval = null;
        let awayCheckInterval = null;

        function startTimer(questType, questId) {
            if (gameState.timer.active) return;
            if (gameState.healTimer.active) {
                addSystemLog('Finish focus healing first.', 'penalty');
                return;
            }

            initAudio();

            const now = Date.now();
            gameState.timer = {
                active: true,
                questId: questId,
                questType: questType,
                timeRemaining: POMODORO_TIME,
                isPaused: false,
                endTimestamp: now + (POMODORO_TIME * 1000),
                startTimestamp: now
            };

            addSystemLog(`Focus session started for ${getQuestById(questType, questId)?.title || 'quest'}. Stay focused!`);
            addEventLog('timer_start', `Focus session started: ${getQuestById(questType, questId)?.title || 'quest'}`);
            saveGameState();

            runTimer();
            startAwayTracking();
            renderAll();
        }

        function runTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (gameState.timer.isPaused || !gameState.timer.active) return;

                const now = Date.now();
                const remaining = Math.max(0, Math.floor((gameState.timer.endTimestamp - now) / 1000));

                gameState.timer.timeRemaining = remaining;

                if (remaining === 0) {
                    completeTimer();
                } else {
                    renderTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!gameState.timer.active || gameState.timer.isPaused) return;

            gameState.timer.isPaused = true;
            gameState.timer.endTimestamp = Date.now() + (gameState.timer.timeRemaining * 1000);

            addSystemLog('Focus session paused.');
            addEventLog('timer_pause', 'Focus session paused');
            stopAwayTracking();
            saveGameState();
            renderTimer();
        }

        function resumeTimer() {
            if (!gameState.timer.active || !gameState.timer.isPaused) return;

            gameState.timer.isPaused = false;
            gameState.timer.endTimestamp = Date.now() + (gameState.timer.timeRemaining * 1000);

            addSystemLog('Welcome back. Timer resumed.', 'success');
            addEventLog('timer_resume', 'Focus session resumed');
            saveGameState();
            runTimer();
            startAwayTracking();
            renderTimer();
        }

        function stopTimer() {
            if (!gameState.timer.active) return;

            clearInterval(timerInterval);
            stopAwayTracking();
            gameState.timer = {
                active: false,
                questId: null,
                questType: null,
                timeRemaining: POMODORO_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            addSystemLog('Focus session cancelled.');
            addEventLog('timer_cancel', 'Focus session cancelled');
            saveGameState();
            renderAll();
        }

        function forfeitSession(isAbandoned = false) {
            clearInterval(timerInterval);
            stopAwayTracking();

            const quest = getQuestById(gameState.timer.questType, gameState.timer.questId);
            const questName = quest?.title || 'session';

            // Apply HP penalty
            const oldHp = gameState.player.hp;
            gameState.player.hp = Math.max(0, gameState.player.hp - DISTRACTION_PENALTY_HP);
            const actualLoss = oldHp - gameState.player.hp;

            playSound(isAbandoned ? 'abandon' : 'forfeit');

            if (isAbandoned) {
                addSystemLog(`Session abandoned. You left the app. -${DISTRACTION_PENALTY_HP} HP penalty.`, 'penalty');
                addEventLog('session_forfeit', 'Session abandoned (app closed)', { hp: -DISTRACTION_PENALTY_HP });
            } else {
                addSystemLog(`You lost focus. Session forfeited. -${DISTRACTION_PENALTY_HP} HP penalty.`, 'penalty');
                addEventLog('session_forfeit', 'Session forfeited (away too long)', { hp: -DISTRACTION_PENALTY_HP });
            }

            // Check for death
            if (gameState.player.hp <= 0) {
                gameState.player.hp = 1;
                gameState.player.xp = 0;
                gameState.player.level = 1;
                gameState.player.maxHp = 100;
                gameState.player.maxXp = 1000;
                gameState.player.rank = 'E-Rank';
                addSystemLog('YOU DIED! Respawning at Level 1...', 'penalty');
                addEventLog('penalty', 'Player died! Respawning at Level 1', { hp: 1, level: 1 });
            }

            // Reset timer without completing session
            gameState.timer = {
                active: false,
                questId: null,
                questType: null,
                timeRemaining: POMODORO_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            gameState.wasAbandoned = isAbandoned;
            saveGameState();
            renderAll();
        }

        function completeTimer() {
            clearInterval(timerInterval);
            stopAwayTracking();

            const quest = getQuestById(gameState.timer.questType, gameState.timer.questId);

            if (quest && !quest.isCompleted) {
                quest.completedSessions++;
                playSound('complete');

                if (quest.completedSessions >= quest.requiredSessions) {
                    quest.isCompleted = true;
                    gameState.player.xp += quest.rewardXp;
                    const oldLevel = gameState.player.level;
                    addSystemLog(`Quest complete! ${quest.title} finished. +${quest.rewardXp} XP awarded.`, 'success');
                    addEventLog('quest_complete', `Quest completed: ${quest.title}`, { xp: quest.rewardXp, gold: quest.rewardGold || 0 });
                    checkLevelUp('quest');
                } else {
                    addSystemLog(`Focus session completed for ${quest.title}. Progress: ${quest.completedSessions}/${quest.requiredSessions}`);
                    addEventLog('quest_complete', `Focus session: ${quest.title} (${quest.completedSessions}/${quest.requiredSessions})`);
                }

                saveGameState();
            }

            gameState.timer = {
                active: false,
                questId: null,
                questType: null,
                timeRemaining: POMODORO_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            saveGameState();
            renderAll();
        }

        // ==================== AWAY TRACKING (ANTI-CHEAT) ====================
        function startAwayTracking() {
            // Track away time when tab is hidden
            document.addEventListener('visibilitychange', handleVisibilityChange);
        }

        function stopAwayTracking() {
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            if (awayInterval) {
                clearInterval(awayInterval);
                awayInterval = null;
            }
        }

        function handleVisibilityChange() {
            if (!gameState.timer.active || gameState.timer.isPaused) return;

            if (document.hidden) {
                // Tab became hidden - pause timer immediately
                gameState.timer.isPaused = true;
                awayStartTime = Date.now();
                gameState.hiddenTimestamp = awayStartTime;
                saveGameState();

                addSystemLog('Timer paused. Return to the app to continue focusing.', 'penalty');
                renderTimer();

                // Start checking for away threshold
                if (awayInterval) clearInterval(awayInterval);
                awayInterval = setInterval(checkAwayThreshold, 1000);
            } else {
                // Tab became visible again
                if (awayInterval) {
                    clearInterval(awayInterval);
                    awayInterval = null;
                }

                const awayDuration = awayStartTime ? Date.now() - awayStartTime : 0;

                if (awayDuration > AWAY_THRESHOLD_MS) {
                    // Too long away - forfeit session
                    forfeitSession(false);
                } else if (gameState.timer.isPaused && gameState.hiddenTimestamp) {
                    // Returned within threshold - resume
                    gameState.timer.isPaused = false;
                    gameState.timer.endTimestamp = Date.now() + (gameState.timer.timeRemaining * 1000);
                    addSystemLog('Welcome back. Timer resumed.', 'success');
                    renderTimer();
                }

                awayStartTime = null;
                gameState.hiddenTimestamp = null;
                saveGameState();
            }
        }

        function checkAwayThreshold() {
            if (!awayStartTime || !gameState.timer.active) {
                if (awayInterval) clearInterval(awayInterval);
                return;
            }

            const awayDuration = Date.now() - awayStartTime;

            if (awayDuration > AWAY_THRESHOLD_MS) {
                // Exceeded threshold - forfeit!
                forfeitSession(false);
            }
        }

        // ==================== FORFEIT ON PAGE CLOSE/RELOAD ====================
        function checkAbandonedSession() {
            if (!gameState.timer.active || gameState.timer.startTimestamp === null) {
                return false;
            }

            // Session was active when page closed - it's abandoned
            const quest = getQuestById(gameState.timer.questType, gameState.timer.questId);
            const questName = quest?.title || 'session';

            // Apply the same forfeit penalty
            const oldHp = gameState.player.hp;
            gameState.player.hp = Math.max(0, gameState.player.hp - DISTRACTION_PENALTY_HP);
            const actualLoss = oldHp - gameState.player.hp;

            playSound('abandon');

            addSystemLog(`Session abandoned. You left the app. -${DISTRACTION_PENALTY_HP} HP penalty.`, 'penalty');
            addEventLog('session_forfeit', 'Session abandoned (page refreshed)', { hp: -DISTRACTION_PENALTY_HP });

            // Check for death
            if (gameState.player.hp <= 0) {
                gameState.player.hp = 1;
                gameState.player.xp = 0;
                gameState.player.level = 1;
                gameState.player.maxHp = 100;
                gameState.player.maxXp = 1000;
                gameState.player.rank = 'E-Rank';
                addSystemLog('YOU DIED! Respawning at Level 1...', 'penalty');
                addEventLog('penalty', 'Player died! Respawning at Level 1', { hp: 1, level: 1 });
            }

            // Reset timer - session doesn't count
            gameState.timer = {
                active: false,
                questId: null,
                questType: null,
                timeRemaining: POMODORO_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            gameState.wasAbandoned = true;

            return true;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // ==================== HEAL TIMER ====================
        let healTimerInterval = null;

        function startFocusHeal() {
            if (gameState.timer.active || gameState.healTimer.active) {
                addSystemLog('Finish current task first.', 'penalty');
                return;
            }

            initAudio();

            const now = Date.now();
            gameState.healTimer = {
                active: true,
                timeRemaining: HEAL_FOCUS_TIME,
                isPaused: false,
                endTimestamp: now + (HEAL_FOCUS_TIME * 1000),
                startTimestamp: now
            };

            addSystemLog('Focus healing started. Stay focused for 5 minutes!', 'success');
            addEventLog('timer_start', 'Focus healing started (5 min)');
            saveGameState();

            runHealTimer();
            startHealAwayTracking();
            renderStatsBar();
        }

        function runHealTimer() {
            if (healTimerInterval) clearInterval(healTimerInterval);

            healTimerInterval = setInterval(() => {
                if (gameState.healTimer.isPaused || !gameState.healTimer.active) return;

                const now = Date.now();
                const remaining = Math.max(0, Math.floor((gameState.healTimer.endTimestamp - now) / 1000));

                gameState.healTimer.timeRemaining = remaining;

                if (remaining === 0) {
                    completeHealSession();
                } else {
                    renderHealTimer();
                }
            }, 1000);
        }

        function completeHealSession() {
            clearInterval(healTimerInterval);
            stopHealAwayTracking();

            // Calculate 20% of max HP
            const healAmount = Math.ceil(gameState.player.maxHp * (HEAL_PERCENT / 100));
            const actualHeal = Math.min(healAmount, gameState.player.maxHp - gameState.player.hp);

            if (actualHeal > 0) {
                gameState.player.hp += actualHeal;
                gameState.lastHealTimestamp = Date.now();
                playSound('complete');
                addSystemLog(`Focus healing complete. Restored ${actualHeal} HP.`, 'success');
                addEventLog('hp_gain', `Focus healing: restored ${actualHeal} HP`, { hp: actualHeal });
            }

            // Reset heal timer
            gameState.healTimer = {
                active: false,
                timeRemaining: HEAL_FOCUS_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            saveGameState();
            renderStatsBar();
            renderProfile();
        }

        function forfeitHealSession() {
            clearInterval(healTimerInterval);
            stopHealAwayTracking();

            // Apply HP penalty for abandoning
            const oldHp = gameState.player.hp;
            gameState.player.hp = Math.max(0, gameState.player.hp - DISTRACTION_PENALTY_HP);
            const actualLoss = oldHp - gameState.player.hp;

            playSound('abandon');
            addSystemLog(`Focus healing abandoned. -${DISTRACTION_PENALTY_HP} HP penalty.`, 'penalty');
            addEventLog('session_forfeit', 'Focus healing abandoned', { hp: -DISTRACTION_PENALTY_HP });

            // Check for death
            if (gameState.player.hp <= 0) {
                gameState.player.hp = 1;
                gameState.player.xp = 0;
                gameState.player.level = 1;
                gameState.player.maxHp = 100;
                gameState.player.maxXp = 1000;
                gameState.player.rank = 'E-Rank';
                addSystemLog('YOU DIED! Respawning at Level 1...', 'penalty');
                addEventLog('penalty', 'Player died! Respawning at Level 1', { hp: 1, level: 1 });
            }

            // Reset heal timer - no HP restored
            gameState.healTimer = {
                active: false,
                timeRemaining: HEAL_FOCUS_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            saveGameState();
            renderStatsBar();
            renderProfile();
        }

        function renderHealTimer() {
            const isPaused = gameState.healTimer.isPaused;
            const containerClass = isPaused ? 'heal-timer-container paused' : 'heal-timer-container';
            const displayClass = isPaused ? 'heal-timer-display paused' : 'heal-timer-display';

            // Add to stats bar or create a floating element
            const hpContainer = document.querySelector('.hp-container');
            if (hpContainer) {
                const existingTimer = document.getElementById('heal-timer-display');
                if (existingTimer) {
                    existingTimer.closest('.heal-timer-container')?.remove();
                }

                const timerHtml = `
                    <div class="${containerClass}" id="heal-timer">
                        <div class="heal-timer-title">Focus Healing</div>
                        <div class="${displayClass}" id="heal-timer-display">${formatTime(gameState.healTimer.timeRemaining)}</div>
                        <div class="heal-timer-controls">
                            ${isPaused
                                ? `<button class="heal-timer-btn" onclick="resumeHealTimer()">Resume</button>`
                                : `<button class="heal-timer-btn" onclick="pauseHealTimer()">Pause</button>`
                            }
                            <button class="heal-timer-btn cancel" onclick="cancelHealTimer()">Cancel</button>
                        </div>
                    </div>
                `;
                hpContainer.insertAdjacentHTML('afterend', timerHtml);
            }
        }

        function pauseHealTimer() {
            if (!gameState.healTimer.active || gameState.healTimer.isPaused) return;

            gameState.healTimer.isPaused = true;
            gameState.healTimer.endTimestamp = Date.now() + (gameState.healTimer.timeRemaining * 1000);

            addSystemLog('Focus healing paused.');
            saveGameState();
            renderHealTimer();
        }

        function resumeHealTimer() {
            if (!gameState.healTimer.active || !gameState.healTimer.isPaused) return;

            gameState.healTimer.isPaused = false;
            gameState.healTimer.endTimestamp = Date.now() + (gameState.healTimer.timeRemaining * 1000);

            addSystemLog('Focus healing resumed.', 'success');
            saveGameState();
            runHealTimer();
            renderHealTimer();
        }

        function cancelHealTimer() {
            if (!gameState.healTimer.active) return;

            clearInterval(healTimerInterval);
            stopHealAwayTracking();

            addSystemLog('Focus healing cancelled.');
            addEventLog('timer_cancel', 'Focus healing cancelled');

            gameState.healTimer = {
                active: false,
                timeRemaining: HEAL_FOCUS_TIME,
                isPaused: false,
                endTimestamp: null,
                startTimestamp: null
            };

            saveGameState();
            renderStatsBar();
        }

        // ==================== HEAL AWAY TRACKING ====================
        let healAwayStartTime = null;
        let healAwayInterval = null;

        function startHealAwayTracking() {
            document.addEventListener('visibilitychange', handleHealVisibilityChange);
        }

        function stopHealAwayTracking() {
            document.removeEventListener('visibilitychange', handleHealVisibilityChange);
            if (healAwayInterval) {
                clearInterval(healAwayInterval);
                healAwayInterval = null;
            }
        }

        function handleHealVisibilityChange() {
            if (!gameState.healTimer.active || gameState.healTimer.isPaused) return;

            if (document.hidden) {
                // Tab became hidden - pause heal timer
                gameState.healTimer.isPaused = true;
                healAwayStartTime = Date.now();
                saveGameState();

                addSystemLog('Focus healing paused. Return to continue.', 'penalty');
                renderHealTimer();

                if (healAwayInterval) clearInterval(healAwayInterval);
                healAwayInterval = setInterval(checkHealAwayThreshold, 1000);
            } else {
                // Tab became visible
                if (healAwayInterval) {
                    clearInterval(healAwayInterval);
                    healAwayInterval = null;
                }

                const awayDuration = healAwayStartTime ? Date.now() - healAwayStartTime : 0;

                if (awayDuration > AWAY_THRESHOLD_MS) {
                    // Too long away - forfeit healing
                    forfeitHealSession();
                } else if (gameState.healTimer.isPaused && healAwayStartTime) {
                    // Returned within threshold - resume
                    gameState.healTimer.isPaused = false;
                    gameState.healTimer.endTimestamp = Date.now() + (gameState.healTimer.timeRemaining * 1000);
                    addSystemLog('Welcome back. Focus healing resumed.', 'success');
                    runHealTimer();
                    renderHealTimer();
                }

                healAwayStartTime = null;
                saveGameState();
            }
        }

        function checkHealAwayThreshold() {
            if (!healAwayStartTime || !gameState.healTimer.active) {
                if (healAwayInterval) clearInterval(healAwayInterval);
                return;
            }

            const awayDuration = Date.now() - healAwayStartTime;

            if (awayDuration > AWAY_THRESHOLD_MS) {
                // Exceeded threshold - forfeit!
                forfeitHealSession();
            }
        }

        // ==================== QUEST HELPERS ====================
        function getQuestById(questType, id) {
            let questArray;
            if (questType === 'daily') questArray = gameState.dailyQuests;
            else if (questType === 'side') questArray = gameState.sideQuests;
            else if (questType === 'big') questArray = gameState.bigQuests;
            return questArray ? questArray.find(q => q.id === id) : null;
        }

        // ==================== RENDERING ====================
        function renderStatsBar() {
            const statsBar = document.getElementById('stats-bar');
            const xpPercent = (gameState.player.xp / gameState.player.maxXp) * 100;
            const canHeal = gameState.player.xp >= HEAL_COST_XP && gameState.player.hp < gameState.player.maxHp;
            const rankClass = getRankClass(gameState.player.rank);

            // Check heal cooldown
            const now = Date.now();
            const healCooldownRemaining = gameState.lastHealTimestamp ? Math.max(0, gameState.lastHealTimestamp + HEAL_COOLDOWN - now) : 0;
            const canUseFocusHeal = !gameState.timer.active && !gameState.healTimer.active && !canHeal;
            const isHealingActive = gameState.healTimer.active;

            statsBar.innerHTML = `
                <div class="level-badge">
                    <span class="level-label">Level</span>
                    <span class="level-value">${gameState.player.level}</span>
                    <span class="rank-badge ${rankClass}">${gameState.player.rank}</span>
                </div>
                <div class="xp-container">
                    <div class="xp-label">
                        <span>XP</span>
                        <span>${gameState.player.xp} / ${gameState.player.maxXp}</span>
                    </div>
                    <div class="xp-bar">
                        <div class="xp-fill" style="width: ${xpPercent}%"></div>
                    </div>
                </div>
                <div class="hp-container">
                    <span class="hp-icon">&#9829;</span>
                    <span class="hp-value">${gameState.player.hp}/${gameState.player.maxHp}</span>
                    <button class="heal-btn" onclick="useXpToHeal()" ${canHeal ? '' : 'disabled'} title="Spend ${HEAL_COST_XP} XP to heal ${HEAL_AMOUNT} HP">
                        Heal
                    </button>
                    <button class="heal-btn ${isHealingActive ? 'active' : ''}" onclick="startFocusHeal()" ${canUseFocusHeal && healCooldownRemaining <= 0 ? '' : 'disabled'} title="Focus healing: 5 min to restore ${HEAL_PERCENT}% HP">
                        ${isHealingActive ? 'Healing...' : 'Focus Heal'}
                    </button>
                    ${healCooldownRemaining > 0 && !isHealingActive ? `<div class="cooldown-timer">Cooldown: ${formatTime(Math.ceil(healCooldownRemaining / 1000))}</div>` : ''}
                </div>
            `;

            // Render heal timer if active
            if (gameState.healTimer.active) {
                renderHealTimer();
            }
        }

        function renderProfile() {
            const profileContent = document.getElementById('profile-content');
            const xpPercent = (gameState.player.xp / gameState.player.maxXp) * 100;
            const rankClass = getRankClass(gameState.player.rank);
            const currentRank = getCurrentRank(gameState.player.level);
            const dailyQuestsCount = gameState.dailyQuests.length;

            // Build rank ladder
            const rankLadderHtml = RANK_TIERS.map(rank => {
                const isAchieved = gameState.player.level >= rank.minLevel;
                const isCurrent = rank.name === gameState.player.rank;
                return `<span class="profile-rank-item ${rank.class} ${isAchieved ? 'achieved' : ''} ${isCurrent ? 'current' : ''}">${rank.name}</span>`;
            }).join('');

            profileContent.innerHTML = `
                <div class="profile-stats">
                    <div class="profile-stat">
                        <div class="profile-stat-label">Rank</div>
                        <div class="profile-stat-value" style="color: var(--rank-${rankClass})">${gameState.player.rank}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">Level</div>
                        <div class="profile-stat-value">${gameState.player.level}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">XP Progress</div>
                        <div class="profile-stat-value">${xpPercent.toFixed(1)}%</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-label">HP</div>
                        <div class="profile-stat-value">${gameState.player.hp}/${gameState.player.maxHp}</div>
                    </div>
                    <div class="profile-stat" style="grid-column: span 2;">
                        <div class="profile-stat-label">Daily Quests</div>
                        <div class="profile-stat-value">${dailyQuestsCount} / ${currentRank.dailyQuests} required</div>
                    </div>
                </div>
                <div class="profile-rank-ladder">
                    <div class="profile-rank-ladder-title">Rank Progression</div>
                    <div class="profile-rank-list">${rankLadderHtml}</div>
                </div>
            `;
        }

        function renderSystemMessage() {
            const logContainer = document.getElementById('system-log');
            if (gameState.systemLog.length === 0) {
                logContainer.innerHTML = `
                    <div class="system-log-entry">
                        <span class="system-log-time">00:00</span>
                        <span class="system-log-text">System initialized. Welcome, Hunter.</span>
                    </div>
                `;
                return;
            }

            logContainer.innerHTML = gameState.systemLog.slice(0, LOG_ENTRIES).map(entry => {
                const typeClass = entry.type || '';
                return `
                    <div class="system-log-entry ${typeClass}">
                        <span class="system-log-time">${entry.time}</span>
                        <span class="system-log-text">${entry.message}</span>
                    </div>
                `;
            }).join('');
        }

        function createQuestCard(quest, hasPenalty = false) {
            const progress = (quest.completedSessions / quest.requiredSessions) * 100;
            const isDisabled = quest.isCompleted || (gameState.timer.active && gameState.timer.questId === quest.id && gameState.timer.questType === quest.type);
            const isTimerActive = gameState.timer.active && gameState.timer.questId === quest.id && gameState.timer.questType === quest.type;

            let rewardsHtml = `<div class="quest-rewards">`;
            if (quest.rewardXp) {
                rewardsHtml += `<div class="reward-item"><span class="reward-icon">&#9733;</span><span class="reward-value">${quest.rewardXp} XP</span></div>`;
            }
            if (quest.rewardGold) {
                rewardsHtml += `<div class="reward-item"><span class="reward-icon">&#9736;</span><span class="reward-value">${quest.rewardGold} Gold</span></div>`;
            }
            if (quest.rewardItem) {
                rewardsHtml += `<div class="reward-item"><span class="reward-icon">&#9670;</span><span class="reward-value">${quest.rewardItem}</span></div>`;
            }
            rewardsHtml += `</div>`;

            return `
                <div class="quest-card" data-quest-id="${quest.id}" data-quest-type="${quest.type}">
                    <div class="quest-header">
                        <span class="quest-title">${quest.title}</span>
                        <span class="quest-difficulty ${quest.difficulty}">${quest.difficulty.toUpperCase()}</span>
                    </div>
                    <div class="quest-description">${quest.description}</div>
                    <div class="quest-progress">
                        <div class="quest-progress-label">
                            <span>Progress</span>
                            <span>${quest.completedSessions} / ${quest.requiredSessions}</span>
                        </div>
                        <div class="quest-progress-bar">
                            <div class="quest-progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    ${rewardsHtml}
                    ${hasPenalty && quest.penalty ? `<div class="quest-penalty"><span class="penalty-icon">&#9888;</span> Failure penalty: -${quest.penalty.hpLoss} HP</div>` : ''}
                    ${!quest.isCompleted ? `<button class="start-focus-btn" onclick="startTimer('${quest.type}', ${quest.id})" ${isDisabled ? 'disabled' : ''}>${isTimerActive ? 'In Progress...' : 'Start Focus Session'}</button>` : ''}
                </div>
            `;
        }

        function renderDailyQuests() {
            const container = document.getElementById('daily-quests');
            if (gameState.dailyQuests.length === 0) {
                container.innerHTML = '<p class="empty-message">No daily quests available</p>';
            } else {
                container.innerHTML = gameState.dailyQuests.map(q => createQuestCard(q, true)).join('');
            }
        }

        function renderSideQuests() {
            const container = document.getElementById('side-quests');
            if (gameState.sideQuests.length === 0) {
                container.innerHTML = '<p class="empty-message">No side quests available</p>';
            } else {
                container.innerHTML = gameState.sideQuests.map(q => createQuestCard(q, false)).join('');
            }
        }

        function renderBigQuests() {
            const container = document.getElementById('big-quests');
            if (gameState.bigQuests.length === 0) {
                container.innerHTML = '<p class="empty-message">No big quests available</p>';
            } else {
                container.innerHTML = gameState.bigQuests.map(q => createQuestCard(q, false)).join('');
            }
        }

        function renderTimer() {
            const quest = getQuestById(gameState.timer.questType, gameState.timer.questId);
            if (!quest || !gameState.timer.active) return;

            const isPaused = gameState.timer.isPaused;
            const timerContainerClass = isPaused ? 'timer-container paused' : 'timer-container';
            const timerDisplayClass = isPaused ? 'timer-display paused' : 'timer-display';

            const timerHtml = `
                <div class="${timerContainerClass}" id="active-timer">
                    <div class="timer-title">Focus: ${quest.title}</div>
                    <div class="${timerDisplayClass}">${formatTime(gameState.timer.timeRemaining)}</div>
                    <div class="timer-controls">
                        ${isPaused
                            ? `<button class="timer-btn" onclick="resumeTimer()">Resume</button>`
                            : `<button class="timer-btn pause" onclick="pauseTimer()">Pause</button>`
                        }
                        <button class="timer-btn reset" onclick="stopTimer()">Reset</button>
                    </div>
                    <div class="timer-warning">${isPaused ? 'Timer paused - click Resume to continue' : 'Leaving the app will forfeit your session.'}</div>
                </div>
            `;

            const questCard = document.querySelector(`[data-quest-id="${quest.id}"][data-quest-type="${gameState.timer.questType}"]`);
            if (questCard) {
                const existingTimer = document.getElementById('active-timer');
                if (existingTimer) existingTimer.remove();
                questCard.insertAdjacentHTML('afterend', timerHtml);
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            const filterSelect = document.getElementById('history-filter');
            const searchInput = document.getElementById('history-search');

            const filterType = filterSelect ? filterSelect.value : 'all';
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

            // Apply filter
            let filteredEvents = gameState.eventLog;

            // Type filter
            if (filterType !== 'all') {
                if (filterType === 'timer') {
                    filteredEvents = filteredEvents.filter(e =>
                        ['timer_start', 'timer_pause', 'timer_resume', 'timer_cancel'].includes(e.type)
                    );
                } else if (filterType === 'hp_change') {
                    filteredEvents = filteredEvents.filter(e =>
                        e.type === 'hp_loss' || e.type === 'hp_gain'
                    );
                } else {
                    filteredEvents = filteredEvents.filter(e => e.type === filterType);
                }
            }

            // Search filter
            if (searchTerm) {
                filteredEvents = filteredEvents.filter(e =>
                    e.message.toLowerCase().includes(searchTerm) ||
                    (e.details && JSON.stringify(e.details).toLowerCase().includes(searchTerm))
                );
            }

            // Limit to 100
            filteredEvents = filteredEvents.slice(0, 100);

            if (filteredEvents.length === 0) {
                container.innerHTML = '<p class="history-empty">No events found.</p>';
                return;
            }

            container.innerHTML = filteredEvents.map(event => {
                const icon = EVENT_ICONS[event.type] || EVENT_ICONS.other;
                let detailsHtml = '';

                if (event.details) {
                    const details = [];
                    if (event.details.xp !== undefined) {
                        details.push(`<span class="history-detail xp">+${event.details.xp} XP</span>`);
                    }
                    if (event.details.hp !== undefined) {
                        const hpClass = event.details.hp < 0 ? 'hp_loss' : 'hp_gain';
                        details.push(`<span class="history-detail ${hpClass}">${event.details.hp > 0 ? '+' : ''}${event.details.hp} HP</span>`);
                    }
                    if (event.details.gold !== undefined) {
                        details.push(`<span class="history-detail gold">${event.details.gold > 0 ? '+' : ''}${event.details.gold} Gold</span>`);
                    }
                    if (event.details.level !== undefined) {
                        details.push(`<span class="history-detail level">LVL ${event.details.level}</span>`);
                    }
                    if (event.details.rank !== undefined) {
                        details.push(`<span class="history-detail rank">${event.details.rank}</span>`);
                    }
                    if (details.length > 0) {
                        detailsHtml = `<div class="history-details">${details.join('')}</div>`;
                    }
                }

                return `
                    <div class="history-card ${event.type}">
                        <div class="history-card-header">
                            <div>
                                <span class="history-icon">${icon}</span>
                            </div>
                            <span class="history-type-badge ${event.type}">${event.type.replace('_', ' ')}</span>
                        </div>
                        <div class="history-timestamp">${event.timestamp}</div>
                        <div class="history-message">${event.message}</div>
                        ${detailsHtml}
                    </div>
                `;
            }).join('');
        }

        function exportEventLog() {
            const events = gameState.eventLog;
            if (events.length === 0) {
                addSystemLog('No events to export.', 'system');
                return;
            }

            const text = events.map(e => {
                let line = `[${e.timestamp}] ${e.type.toUpperCase()}: ${e.message}`;
                if (e.details) {
                    const parts = [];
                    if (e.details.xp) parts.push(`XP: ${e.details.xp}`);
                    if (e.details.hp) parts.push(`HP: ${e.details.hp}`);
                    if (e.details.gold) parts.push(`Gold: ${e.details.gold}`);
                    if (e.details.level) parts.push(`Level: ${e.details.level}`);
                    if (e.details.rank) parts.push(`Rank: ${e.details.rank}`);
                    if (parts.length) line += ` (${parts.join(', ')})`;
                }
                return line;
            }).join('\n');

            try {
                navigator.clipboard.writeText(text).then(() => {
                    addSystemLog('Event log copied to clipboard.', 'success');
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    addSystemLog('Event log copied to clipboard.', 'success');
                });
            } catch (e) {
                addSystemLog('Failed to copy to clipboard.', 'penalty');
            }
        }

        function renderAll() {
            renderStatsBar();
            renderProfile();
            renderDailyQuests();
            renderSideQuests();
            renderBigQuests();
            renderHistory();

            if (gameState.timer.active) {
                setTimeout(renderTimer, 100);
            }

            if (gameState.healTimer.active) {
                setTimeout(renderHealTimer, 100);
            }
        }

        // ==================== QUEST FORMS ====================
        function toggleAddForm(type) {
            const toggle = document.querySelector(`#${type} .add-quest-toggle`);
            const form = document.getElementById(`${type}-form`);
            if (toggle && form) {
                toggle.classList.toggle('active');
                form.classList.toggle('active');
            }
        }

        function validateForm(type) {
            let isValid = true;

            const titleInput = document.getElementById(`${type}-title`);
            const titleError = document.getElementById(`${type}-title-error`);
            if (titleInput && titleError) {
                if (!titleInput.value.trim()) {
                    titleError.classList.add('show');
                    isValid = false;
                } else {
                    titleError.classList.remove('show');
                }
            }

            const sessionsInput = document.getElementById(`${type}-sessions`);
            const sessionsError = document.getElementById(`${type}-sessions-error`);
            if (sessionsInput && sessionsError) {
                if (parseInt(sessionsInput.value) < 1) {
                    sessionsError.classList.add('show');
                    isValid = false;
                } else {
                    sessionsError.classList.remove('show');
                }
            }

            return isValid;
        }

        function submitDailyQuest() {
            if (!validateForm('daily')) return;

            const title = document.getElementById('daily-title').value.trim();
            const desc = document.getElementById('daily-desc').value.trim();
            const sessions = parseInt(document.getElementById('daily-sessions').value);
            const penalty = parseInt(document.getElementById('daily-penalty').value);

            const newQuest = {
                id: Date.now(),
                type: 'daily',
                title: title,
                description: desc || 'Complete your daily task',
                difficulty: 'c',
                requiredSessions: sessions,
                completedSessions: 0,
                isCompleted: false,
                rewardXp: 100,
                rewardGold: 1,
                penalty: { hpLoss: penalty }
            };

            gameState.dailyQuests.push(newQuest);
            addSystemLog(`New daily quest added: ${title}`, 'success');

            saveGameState();
            toggleAddForm('daily');
            renderAll();

            document.getElementById('daily-title').value = '';
            document.getElementById('daily-desc').value = '';
            document.getElementById('daily-sessions').value = '1';
            document.getElementById('daily-penalty').value = '10';
        }

        function submitSideQuest() {
            if (!validateForm('side')) return;

            const title = document.getElementById('side-title').value.trim();
            const desc = document.getElementById('side-desc').value.trim();
            const sessions = parseInt(document.getElementById('side-sessions').value);
            const xp = parseInt(document.getElementById('side-xp').value);
            const item = document.getElementById('side-item').value.trim();

            let difficulty = 'd';
            if (sessions >= 5) difficulty = 'b';
            if (sessions >= 10) difficulty = 'a';

            const newQuest = {
                id: Date.now(),
                type: 'side',
                title: title,
                description: desc || 'Complete this side quest',
                difficulty: difficulty,
                requiredSessions: sessions,
                completedSessions: 0,
                isCompleted: false,
                rewardXp: xp,
                rewardItem: item || null
            };

            gameState.sideQuests.push(newQuest);
            addSystemLog(`New side quest added: ${title}`, 'success');

            saveGameState();
            toggleAddForm('side');
            renderAll();

            document.getElementById('side-title').value = '';
            document.getElementById('side-desc').value = '';
            document.getElementById('side-sessions').value = '1';
            document.getElementById('side-xp').value = '100';
            document.getElementById('side-item').value = '';
        }

        function submitBigQuest() {
            if (!validateForm('big')) return;

            const title = document.getElementById('big-title').value.trim();
            const desc = document.getElementById('big-desc').value.trim();
            const sessions = parseInt(document.getElementById('big-sessions').value);
            const xp = parseInt(document.getElementById('big-xp').value);
            const item = document.getElementById('big-item').value.trim();
            const isMainStory = document.getElementById('big-main').checked;

            let difficulty = 'c';
            if (sessions >= 5) difficulty = 'b';
            if (sessions >= 10) difficulty = 'a';
            if (sessions >= 20) difficulty = 's';

            const newQuest = {
                id: Date.now(),
                type: 'big',
                title: title,
                description: desc || 'Complete this big quest',
                difficulty: difficulty,
                requiredSessions: sessions,
                completedSessions: 0,
                isCompleted: false,
                rewardXp: xp,
                rewardItem: item || null,
                isMainStory: isMainStory
            };

            gameState.bigQuests.push(newQuest);
            addSystemLog(`New big quest added: ${title}${isMainStory ? ' (Main Story)' : ''}`, 'success');

            saveGameState();
            toggleAddForm('big');
            renderAll();

            document.getElementById('big-title').value = '';
            document.getElementById('big-desc').value = '';
            document.getElementById('big-sessions').value = '1';
            document.getElementById('big-xp').value = '500';
            document.getElementById('big-item').value = '';
            document.getElementById('big-main').checked = false;
        }

        // ==================== PROFILE TOGGLE ====================
        function toggleProfile() {
            const content = document.getElementById('profile-content');
            const toggle = document.getElementById('profile-toggle');
            content.classList.toggle('open');
            toggle.classList.toggle('open');
        }

        // ==================== TABS ====================
        function setupTabs() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.quest-section').forEach(s => s.classList.remove('active'));
                    document.getElementById(tab).classList.add('active');
                });
            });
        }

        // ==================== DELETE ALL DATA ====================
        function deleteAllData() {
            if (confirm('Are you sure you want to reset all data? This cannot be undone.')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // ==================== INIT ====================
        function init() {
            loadGameState();

            // Check FIRST if a session was abandoned (user closed app during focus)
            const wasAbandoned = checkAbandonedSession();

            // Ensure rank is set correctly based on current level
            gameState.player.rank = getCurrentRank(gameState.player.level).name;

            checkDailyReset();
            generateDailyQuests();
            ensureDailyQuestsForRank();
            generateSideQuests();
            generateBigQuests();

            // Check for rank changes on load (in case of large level jumps)
            const oldLevel = gameState.player.level;
            checkRankChange(oldLevel, oldLevel);

            setupTabs();
            renderAll();

            if (gameState.timer.active) {
                // Resume active timer session
                runTimer();
                startAwayTracking();
            }

            if (gameState.healTimer.active) {
                // Resume active heal timer session
                runHealTimer();
                startHealAwayTracking();
            }

            addSystemLog('System initialized. Welcome, Hunter.');
        }

        // Start the app
        init();
    </script>
</body>
