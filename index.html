<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling Quest System</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a1a;
            --primary-accent: #00d4ff;
            --secondary-accent: #0066ff;
            --text-primary: #e0e0e0;
            --text-secondary: #888899;
            --card-bg: #12122a;
            --card-border: #1a1a3a;
            --success: #00ff88;
            --danger: #ff3366;
            --xp-gold: #ffaa00;
            --rank-e: #888899;
            --rank-d: #22aa22;
            --rank-c: #3366ff;
            --rank-b: #9966ff;
            --rank-a: #ff8800;
            --rank-s: #ffd700;
            --rank-national: #ff2222;
            --rank-special: #aa0000;
            --rank-monarch: #9933ff;
            --rank-shadow: #440066;
        }

        body {
            font-family: 'Rajdhani', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            font-size: 16px;
            line-height: 1.5;
            padding-top: constant(safe-area-inset-top, 0px);
            padding-top: env(safe-area-inset-top, 0px);
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
            padding-top: 24px;
        }

        /* Top Stats Bar */
        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .level-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .level-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-accent);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        .rank-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid;
        }

        .rank-badge.e { background: rgba(136, 136, 153, 0.2); color: var(--rank-e); border-color: var(--rank-e); }
        .rank-badge.d { background: rgba(34, 170, 34, 0.2); color: var(--rank-d); border-color: var(--rank-d); }
        .rank-badge.c { background: rgba(51, 102, 255, 0.2); color: var(--rank-c); border-color: var(--rank-c); }
        .rank-badge.b { background: rgba(153, 102, 255, 0.2); color: var(--rank-b); border-color: var(--rank-b); }
        .rank-badge.a { background: rgba(255, 136, 0, 0.2); color: var(--rank-a); border-color: var(--rank-a); }
        .rank-badge.s { background: rgba(255, 215, 0, 0.2); color: var(--rank-s); border-color: var(--rank-s); text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
        .rank-badge.national { background: rgba(255, 34, 34, 0.2); color: var(--rank-national); border-color: var(--rank-national); text-shadow: 0 0 8px rgba(255, 34, 34, 0.6); }
        .rank-badge.special { background: rgba(170, 0, 0, 0.2); color: #ff4444; border-color: #ff4444; text-shadow: 0 0 8px rgba(255, 68, 68, 0.6); }
        .rank-badge.monarch { background: rgba(153, 51, 255, 0.2); color: #bb66ff; border-color: #bb66ff; text-shadow: 0 0 8px rgba(187, 102, 255, 0.6); }
        .rank-badge.shadow { background: rgba(68, 0, 102, 0.3); color: #cc66ff; border-color: #cc66ff; text-shadow: 0 0 12px rgba(204, 102, 255, 0.8), 0 0 20px rgba(68, 0, 102, 0.6); animation: shadowPulse 2s ease-in-out infinite; }

        @keyframes shadowPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(204, 102, 255, 0.4); }
            50% { box-shadow: 0 0 16px rgba(204, 102, 255, 0.6), 0 0 24px rgba(68, 0, 102, 0.4); }
        }

        .xp-container {
            flex: 1;
            margin: 0 20px;
        }

        .xp-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .xp-bar {
            height: 10px;
            background: #1a1a2e;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--xp-gold), #ff8800);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
            transition: width 0.3s ease;
        }

        .hp-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hp-icon {
            color: var(--danger);
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.8);
            font-size: 20px;
        }

        .hp-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--danger);
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }

        /* Heal Button */
        .heal-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.15), transparent);
            border: 1px solid var(--success);
            border-radius: 6px;
            color: var(--success);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .heal-btn:hover {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.25), transparent);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .heal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .heal-btn.active {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.3), transparent);
            animation: healPulse 1.5s ease-in-out infinite;
        }

        @keyframes healPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
        }

        .heal-timer-container {
            margin-top: 12px;
            padding: 14px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            text-align: center;
        }

        .heal-timer-container.paused {
            border-color: var(--xp-gold);
            background: rgba(255, 170, 0, 0.1);
        }

        .heal-timer-title {
            font-size: 13px;
            color: var(--success);
            margin-bottom: 6px;
        }

        .heal-timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            margin-bottom: 10px;
        }

        .heal-timer-display.paused {
            color: var(--xp-gold);
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
        }

        .heal-timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .heal-timer-btn {
            padding: 6px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            cursor: pointer;
        }

        .heal-timer-btn.cancel {
            border-color: var(--danger);
            color: var(--danger);
        }

        .cooldown-timer {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Level Up Banner */
        .level-up-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            animation: levelUpFade 3s ease-out forwards;
        }

        @keyframes levelUpFade {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .level-up-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--xp-gold);
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.8), 0 0 60px rgba(255, 170, 0, 0.5);
            animation: levelUpPulse 0.5s ease-in-out infinite;
            margin-bottom: 16px;
        }

        @keyframes levelUpPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .level-up-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        .level-up-stats {
            margin-top: 24px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .level-up-stat {
            margin: 8px 0;
        }

        .level-up-stat span {
            color: var(--success);
            font-weight: 600;
        }

        /* Rank Up Banner */
        .rank-up-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            text-align: center;
            animation: rankUpFade 4s ease-out forwards;
        }

        @keyframes rankUpFade {
            0% { opacity: 0; transform: scale(1.2); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .rank-up-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-accent);
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
            margin-bottom: 16px;
            animation: rankUpPulse 0.6s ease-in-out infinite;
        }

        @keyframes rankUpPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .rank-up-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            color: var(--xp-gold);
            text-shadow: 0 0 15px rgba(255, 170, 0, 0.8);
        }

        .rank-up-shadow-monarch {
            font-size: 32px;
            color: #cc66ff;
            text-shadow: 0 0 30px rgba(204, 102, 255, 0.8), 0 0 50px rgba(68, 0, 102, 0.6), 0 0 80px rgba(68, 0, 102, 0.4);
            animation: shadowMonarchPulse 1s ease-in-out infinite;
        }

        @keyframes shadowMonarchPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(204, 102, 255, 0.8), 0 0 50px rgba(68, 0, 102, 0.6); }
            50% { transform: scale(1.08); text-shadow: 0 0 40px rgba(204, 102, 255, 1), 0 0 60px rgba(68, 0, 102, 0.8), 0 0 100px rgba(68, 0, 102, 0.5); }
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            min-height: 52px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            border-color: rgba(0, 212, 255, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.15), transparent);
            border-color: var(--primary-accent);
            color: var(--primary-accent);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        /* Quest Content */
        .quest-content {
            flex: 1;
        }

        .quest-section {
            display: none;
        }

        .quest-section.active {
            display: block;
        }

        /* Quest Cards */
        .quest-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .quest-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-accent);
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .quest-difficulty {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .quest-difficulty.s { background: rgba(255, 215, 0, 0.2); color: var(--rank-s); }
        .quest-difficulty.a { background: rgba(255, 136, 0, 0.2); color: var(--rank-a); }
        .quest-difficulty.b { background: rgba(153, 102, 255, 0.2); color: var(--rank-b); }
        .quest-difficulty.c { background: rgba(51, 102, 255, 0.2); color: var(--rank-c); }
        .quest-difficulty.d { background: rgba(34, 170, 34, 0.2); color: var(--rank-d); }
        .quest-difficulty.e { background: rgba(136, 136, 153, 0.2); color: var(--rank-e); }

        .quest-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .quest-progress {
            margin-bottom: 12px;
        }

        .quest-progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .quest-progress-bar {
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .quest-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
            transition: width 0.3s ease;
        }

        .quest-rewards {
            display: flex;
            gap: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        .reward-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .reward-icon {
            color: var(--success);
            text-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
        }

        .reward-value {
            color: var(--success);
            font-weight: 600;
        }

        .quest-penalty {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
            font-size: 13px;
            color: var(--danger);
        }

        .penalty-icon {
            margin-right: 6px;
        }

        .start-focus-btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.2), transparent);
            border: 1px solid var(--primary-accent);
            border-radius: 6px;
            color: var(--primary-accent);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .start-focus-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.3), transparent);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .start-focus-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Timer */
        .timer-container {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-accent);
            border-radius: 8px;
            text-align: center;
        }

        .timer-container.paused {
            border-color: var(--xp-gold);
            background: rgba(255, 170, 0, 0.1);
        }

        .timer-container.forfeited {
            border-color: var(--danger);
            background: rgba(255, 51, 102, 0.1);
        }

        .timer-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-accent);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
            margin-bottom: 12px;
        }

        .timer-display.paused {
            color: var(--xp-gold);
            text-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .timer-btn {
            padding: 8px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timer-btn.pause {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .timer-btn.reset {
            background: rgba(255, 170, 0, 0.2);
            border-color: var(--xp-gold);
            color: var(--xp-gold);
        }

        .timer-warning {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        /* Add Quest Form */
        .add-quest-toggle {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px dashed var(--card-border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .add-quest-toggle:hover, .add-quest-toggle.active {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .add-quest-form {
            display: none;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .add-quest-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a2e;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-accent);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-error {
            font-size: 11px;
            color: var(--danger);
            margin-top: 4px;
            display: none;
        }

        .form-error.show {
            display: block;
        }

        .form-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.2), transparent);
            border: 1px solid var(--success);
            border-radius: 6px;
            color: var(--success);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .form-submit:hover {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.3), transparent);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 24px;
            font-style: italic;
        }

        /* System Message */
        .system-message {
            margin-top: 20px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            font-family: 'Rajdhani', monospace;
            font-size: 14px;
            color: var(--primary-accent);
        }

        .system-log {
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .system-log-entry {
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 13px;
        }

        .system-log-entry:last-child {
            border-bottom: none;
        }

        .system-log-time {
            color: var(--text-secondary);
            margin-right: 8px;
        }

        .system-log-text {
            color: var(--text-primary);
        }

        .system-log-entry.success .system-log-text { color: var(--success); }

        const EVENT_TYPE_GROUPS = {
            timer: ['timer_start', 'timer_pause', 'timer_resume', 'timer_cancel']
        };

        // Away tracking variables (not persisted)
        let awayStartTime = null;
        let awayInterval = null;

        // ==================== AUDIO ====================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'complete') {
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'penalty') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'levelup') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'rankup') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
                    oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
                    oscillator.frequency.setValueAtTime(1046.5, audioCtx.currentTime + 0.45);
                    oscillator.frequency.setValueAtTime(1318.5, audioCtx.currentTime + 0.6);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.8);
                } else if (type === 'shadowmonarch') {
                    // Extra dramatic sound for Shadow Monarch
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(220, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(277.18, audioCtx.currentTime + 0.2);
                    oscillator.frequency.setValueAtTime(349.23, audioCtx.currentTime + 0.4);
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime + 0.6);
                    oscillator.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.8);
                    oscillator.frequency.setValueAtTime(698.46, audioCtx.currentTime + 1.0);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 1.2);
                } else if (type === 'forfeit' || type === 'abandon') {
                    // Distraction/forfeit sound
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        // ==================== STORAGE ====================
        function saveGameState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch (e) {
                console.log('Save error:', e);
            }
        }

        function loadGameState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const loaded = JSON.parse(saved);
                    gameState.player = loaded.player || gameState.player;
                    gameState.dailyQuests = loaded.dailyQuests || [];
                    gameState.sideQuests = loaded.sideQuests || [];
                    gameState.bigQuests = loaded.bigQuests || [];
                    gameState.systemMessage = loaded.systemMessage;
                    gameState.lastResetDate = loaded.lastResetDate;
                    gameState.systemLog = loaded.systemLog || [];
                    gameState.eventLog = loaded.eventLog || [];
                    gameState.questsGenerated = loaded.questsGenerated || false;
                    gameState.sideQuestsGenerated = loaded.sideQuestsGenerated || false;
                    gameState.bigQuestsGenerated = loaded.bigQuestsGenerated || false;
                    gameState.lastHealTimestamp = loaded.lastHealTimestamp || null;
                    gameState.hiddenTimestamp = loaded.hiddenTimestamp || null;
                    gameState.wasAbandoned = loaded.wasAbandoned || false;

                    // Restore heal timer if was active
                    if (loaded.healTimer && loaded.healTimer.active) {
                        const now = Date.now();
                        const endTime = loaded.healTimer.endTimestamp;
                        if (endTime && endTime > now) {
                            gameState.healTimer = {
                                active: true,
                                timeRemaining: Math.floor((endTime - now) / 1000),
                                isPaused: loaded.healTimer.isPaused || false,
                                endTimestamp: endTime,
                                startTimestamp: loaded.healTimer.startTimestamp || null
                            };
                        } else {
                            gameState.healTimer = {
                                active: false,
                                timeRemaining: HEAL_FOCUS_TIME,
                                isPaused: false,
                                endTimestamp: null,
                                startTimestamp: null
                            };
                        }
                    } else if (loaded.healTimer) {
                        gameState.healTimer = {
                            active: loaded.healTimer.active || false,
                            timeRemaining: loaded.healTimer.timeRemaining || HEAL_FOCUS_TIME,
                            isPaused: loaded.healTimer.isPaused || false,
                            endTimestamp: loaded.healTimer.endTimestamp || null,
                            startTimestamp: loaded.healTimer.startTimestamp || null
                        };
                    }

                    // Restore timer if was active - keep all fields including startTimestamp
                    if (loaded.timer && loaded.timer.active) {
                        const now = Date.now();
                        const endTime = loaded.timer.endTimestamp;
                        if (endTime && endTime > now) {
                            gameState.timer = {
                                active: true,
                                questId: loaded.timer.questId,
                                questType: loaded.timer.questType,
                                timeRemaining: Math.floor((endTime - now) / 1000),
                                isPaused: loaded.timer.isPaused || false,
                                endTimestamp: endTime,
                                startTimestamp: loaded.timer.startTimestamp || null
                            };
                        } else {
                            // Timer expired - just mark inactive, will be handled by checkAbandonedSession in init if there was an active session
                            gameState.timer = {
                                active: false,
                                questId: loaded.timer.questId,
                                questType: loaded.timer.questType,
                                timeRemaining: POMODORO_TIME,
                                isPaused: false,
                                endTimestamp: null,
                                startTimestamp: null
                            };
                        }
                    } else if (loaded.timer) {
                        // No active timer but has timer data - restore with all fields
                        gameState.timer = {
                            active: loaded.timer.active || false,
                            questId: loaded.timer.questId || null,
                            questType: loaded.timer.questType || null,
                            timeRemaining: loaded.timer.timeRemaining || POMODORO_TIME,
                            isPaused: loaded.timer.isPaused || false,
                            endTimestamp: loaded.timer.endTimestamp || null,
                            startTimestamp: loaded.timer.startTimestamp || null
                        };
                    }
                }
            } catch (e) {
                console.log('Load error:', e);
            }
        }

        // ==================== UTILITIES ====================
        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function getCurrentRank(level) {
            for (let i = RANK_TIERS.length - 1; i >= 0; i--) {
                if (level >= RANK_TIERS[i].minLevel) {
                    return RANK_TIERS[i];
                }
            }
            return RANK_TIERS[0];
        }

        function getRankClass(rankName) {
            const rank = RANK_TIERS.find(r => r.name === rankName);
            return rank ? rank.class : 'e';
        }

        function addSystemLog(message, type = '') {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            gameState.systemLog.unshift({ time: timeStr, message: message, type: type });

            if (gameState.systemLog.length > 50) {
                gameState.systemLog = gameState.systemLog.slice(0, 50);
            }

            gameState.systemMessage = message;
            saveGameState();
        }

        function addEventLog(type, message, details = null) {
            const now = new Date();
            const fullTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const event = {
                id: Date.now(),
                timestamp: fullTime,
                type: type,
                message: message,
                details: details
            };

            gameState.eventLog.unshift(event);

            if (gameState.eventLog.length > MAX_EVENT_LOG) {
                gameState.eventLog = gameState.eventLog.slice(0, MAX_EVENT_LOG);
            }

            saveGameState();
        }

        function clearEventLog() {
            if (confirm('Are you sure you want to clear all event history?')) {
                gameState.eventLog = [];
                saveGameState();
                renderHistory();
                addSystemLog('Event history cleared.', 'system');
            }
        }

        // ==================== DAILY RESET ====================
        function checkDailyReset() {
            const today = getTodayString();
            const lastReset = gameState.lastResetDate;

            if (lastReset !== today) {
                // Apply penalties for incomplete daily quests
                if (lastReset) {
                    gameState.dailyQuests.forEach(quest => {
                        if (!quest.isCompleted && quest.penalty && quest.penalty.hpLoss > 0) {
                            const oldHp = gameState.player.hp;
                            gameState.player.hp = Math.max(0, gameState.player.hp - quest.penalty.hpLoss);
                            const actualLoss = oldHp - gameState.player.hp;
                            if (actualLoss > 0) {
                                addSystemLog(`Daily quest '${quest.title}' failed. Penalty: -${actualLoss} HP.`, 'penalty');
                                addEventLog('penalty', `Daily quest failed: ${quest.title}`, { hp: -actualLoss });
                            }
                        }
                    });

                    // Check for death
                    if (gameState.player.hp <= 0) {
                        gameState.player.hp = 1;
                        gameState.player.xp = 0;
                        gameState.player.level = 1;
                        gameState.player.maxHp = 100;
                        gameState.player.maxXp = 1000;
                        gameState.player.rank = 'E-Rank';
                        addSystemLog('YOU DIED! Respawning at Level 1...', 'penalty');
                        addEventLog('penalty', 'Player died! Respawning at Level 1', { hp: 1, level: 1 });
                    }
                }

                // Reset daily quests progress
                gameState.dailyQuests.forEach(quest => {
                    quest.completedSessions = 0;
                    quest.isCompleted = false;
                });

                gameState.lastResetDate = today;
                addSystemLog(`New day! Login bonus: +${LOGIN_BONUS_XP} XP.`, 'success');
                addEventLog('daily_reset', 'New day! Daily quests reset', { xp: LOGIN_BONUS_XP });
                addEventLog('xp_gain', `Login bonus: +${LOGIN_BONUS_XP} XP`, { xp: LOGIN_BONUS_XP });
                saveGameState();
            }
        }

        // ==================== DAILY QUEST GENERATION ====================
        function generateDailyQuests() {
            if (gameState.questsGenerated) return;

            const currentRank = getCurrentRank(gameState.player.level);
            const requiredQuests = currentRank.dailyQuests;
            const existingCount = gameState.dailyQuests.filter(q => !q.generated).length;

            // Only count user-created quests - add generated ones to fill the gap
            const questsToAdd = Math.max(0, requiredQuests - existingCount);

            for (let i = 0; i < questsToAdd; i++) {
                const template = GENERIC_DAILY_QUESTS[i % GENERIC_DAILY_QUESTS.length];
                const newQuest = {
                    id: Date.now() + i,
                    type: 'daily',
                    title: template.title,
                    description: template.description,
                    difficulty: template.difficulty,
                    requiredSessions: 1,
                    completedSessions: 0,
                    isCompleted: false,
                    rewardXp: template.xp,
                    rewardGold: 1,
                    penalty: { hpLoss: template.penalty },
                    generated: true
                };
                gameState.dailyQuests.push(newQuest);
            }

            if (questsToAdd > 0) {
                gameState.questsGenerated = true;
                addSystemLog(`Auto-generated ${questsToAdd} daily quests for ${currentRank.name}.`, 'success');
                saveGameState();
            }
        }

        function ensureDailyQuestsForRank() {
            const currentRank = getCurrentRank(gameState.player.level);
            const requiredQuests = currentRank.dailyQuests;
            const generatedQuests = gameState.dailyQuests.filter(q => q.generated);

            if (generatedQuests.length < requiredQuests) {
                // Remove old generated quests and regenerate
                gameState.dailyQuests = gameState.dailyQuests.filter(q => !q.generated);
                generateDailyQuests();
            }
        }

        function generateSideQuests() {
            if (gameState.sideQuestsGenerated) return;

            GENERIC_SIDE_QUESTS.forEach((template, index) => {
                const newQuest = {
                    id: Date.now() + index,
                    type: 'side',
                    title: template.title,
                    description: template.description,
                    difficulty: template.difficulty,
                    requiredSessions: 1,
                    completedSessions: 0,
                    isCompleted: false,
                    rewardXp: template.xp,
                    rewardGold: template.gold,
                    generated: true
                };
                gameState.sideQuests.push(newQuest);
            });

            gameState.sideQuestsGenerated = true;
            addSystemLog('Side quests initialized.', 'success');
            saveGameState();
        }

        function generateBigQuests() {
            if (gameState.bigQuestsGenerated) return;

            GENERIC_BIG_QUESTS.forEach((template, index) => {
                const newQuest = {
                    id: Date.now() + index,
                    type: 'big',
                    title: template.title,
                    description: template.description,
                    difficulty: template.difficulty,
                    requiredSessions: template.sessions || 1,
                    completedSessions: 0,
                    isCompleted: false,
                    rewardXp: template.xp,
                    rewardGold: template.gold,
                    generated: true
                };
                gameState.bigQuests.push(newQuest);
            });

            gameState.bigQuestsGenerated = true;
            addSystemLog('Big quests initialized.', 'success');
            saveGameState();
        }

        // ==================== LEVEL UP ====================
        function checkLevelUp(source) {
            let leveledUp = false;
            const oldLevel = gameState.player.level;

            while (gameState.player.xp >= gameState.player.maxXp) {
                gameState.player.xp -= gameState.player.maxXp;
                gameState.player.level++;
                gameState.player.maxXp = Math.floor(gameState.player.maxXp * XP_SCALE);
                gameState.player.maxHp += HP_PER_LEVEL;
                gameState.player.hp = gameState.player.maxHp;
                leveledUp = true;
            }

            if (leveledUp) {
                // Check for rank changes (pass old and new levels for multi-rank scenarios)
                checkRankChange(oldLevel, gameState.player.level);

                showLevelUpBanner();
                addSystemLog(`LEVEL UP! You are now level ${gameState.player.level}. Max HP +${HP_PER_LEVEL}. HP fully restored.`, 'levelup');
                addEventLog('level_up', `Level up! Now level ${gameState.player.level}`, { level: gameState.player.level, hp: gameState.player.maxHp });
                playSound('levelup');
                saveGameState();
            }

            return leveledUp;
        }

        // ==================== RANK CHANGE ====================
        function getRankAtLevel(level) {
            for (let i = RANK_TIERS.length - 1; i >= 0; i--) {
                if (level >= RANK_TIERS[i].minLevel) {
                    return RANK_TIERS[i];
                }
            }
            return RANK_TIERS[0];
        }

        function checkRankChange(oldLevel, newLevel) {
            const oldRank = getRankAtLevel(oldLevel);
            const newRank = getRankAtLevel(newLevel);

            if (newRank.name !== oldRank.name) {
                gameState.player.rank = newRank.name;

                // Ensure enough daily quests for new rank
                ensureDailyQuestsForRank();

                // Show appropriate rank up message
                if (newRank.name === 'Shadow Monarch') {
                    showRankUpBanner(newRank.name, true);
                    addSystemLog(`RANK UP! You are now ${newRank.name}. You have awakened as the SHADOW MONARCH!`, 'rankup');
                    addEventLog('rank_up', `Rank up! Now ${newRank.name}`, { rank: newRank.name });
                    playSound('shadowmonarch');
                } else {
                    showRankUpBanner(newRank.name, false);
                    addSystemLog(`RANK UP! You are now ${newRank.name}.`, 'rankup');
                    addEventLog('rank_up', `Rank up! Now ${newRank.name}`, { rank: newRank.name });
                    playSound('rankup');
                }
            } else if (newLevel > oldLevel) {
                // Multiple levels gained but same rank - check if we crossed a rank threshold
                // Find any rank tiers between old and new level
                let crossedAnyRank = false;
                for (let i = 0; i < RANK_TIERS.length; i++) {
                    const rankTier = RANK_TIERS[i];
                    if (oldLevel < rankTier.minLevel && newLevel >= rankTier.minLevel) {
                        crossedAnyRank = true;
                        gameState.player.rank = rankTier.name;
                        ensureDailyQuestsForRank();

                        if (rankTier.name === 'Shadow Monarch') {
                            showRankUpBanner(rankTier.name, true);
                            addSystemLog(`RANK UP! You are now ${rankTier.name}. You have awakened as the SHADOW MONARCH!`, 'rankup');
                            addEventLog('rank_up', `Rank up! Now ${rankTier.name}`, { rank: rankTier.name });
                            playSound('shadowmonarch');
                        } else {
                            showRankUpBanner(rankTier.name, false);
                            addSystemLog(`RANK UP! You are now ${rankTier.name}.`, 'rankup');
                            addEventLog('rank_up', `Rank up! Now ${rankTier.name}`, { rank: rankTier.name });
                            playSound('rankup');
                        }
                    }
                }
            }
        }

        function showLevelUpBanner() {
            const overlay = document.createElement('div');
            overlay.className = 'level-up-banner';
            overlay.id = 'level-up-banner';
            overlay.innerHTML = `
                <div class="level-up-title">LEVEL UP!</div>
                <div class="level-up-subtitle">You are now level ${gameState.player.level}</div>
                <div class="level-up-stats">
                    <div class="level-up-stat">Max HP: <span>${gameState.player.maxHp}</span></div>
                    <div class="level-up-stat">XP: <span>${gameState.player.xp} / ${gameState.player.maxXp}</span></div>
                </div>
            `;

            setTimeout(() => {
                if (overlay.parentNode) {
                    overlay.remove();
                }
